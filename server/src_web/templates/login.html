<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — лаборатория</title>
  <link rel="stylesheet" href="/css/log.css" />
</head>
<body>
  <div class="container">
    <form id="loginForm" class="form">
      <h2>Вход оператора</h2>
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Войти</button>
      <p class="switch">Нет аккаунта? <a href="/register">Регистрация</a></p>
      <p id="errorMessage" class="error" style="display:none;"></p>
      <p id="successMessage" class="success" style="display:none;"></p>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      fetch('/api/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      }).then(r => r.json().then(d => ({ok:r.ok,d}))).then(({ok,d}) => {
        if (!ok) throw new Error(d.error);
        document.getElementById('successMessage').textContent = 'Успешно. Переход...';
        document.getElementById('successMessage').style.display = 'block';
        setTimeout(() => location.href = '/statistics', 400);
      }).catch(() => {
        document.getElementById('errorMessage').textContent = 'Неверный логин или пароль';
        document.getElementById('errorMessage').style.display = 'block';
      });
    });
  </script>
</body>
</html>
