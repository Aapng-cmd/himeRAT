<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Узлы — панель лаборатории</title>
  <style>
    body { margin:0; font-family:'Segoe UI',sans-serif; background:#1a1a2e; color:#eaeaea; }
    header { background:#16213e; padding:1rem 2rem; display:flex; gap:1rem; }
    header a { background:#0f3460; padding:.6rem 1.2rem; border-radius:4px; color:#eaeaea; text-decoration:none; }
    main { padding:2rem; max-width:1100px; margin:0 auto; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    th,td { padding:.75rem; border:1px solid #333; text-align:left; }
    th { background:#0f3460; }
    tr:nth-child(even) { background:#16213e; }
    .btn { background:#ff4c60; color:#fff; border:none; padding:.4rem .8rem; border-radius:4px; cursor:pointer; text-decoration:none; display:inline-block; }
  </style>
</head>
<body>
  <header>
    <a href="/statistics">Узлы</a>
    <a href="/home">Главная</a>
  </header>
  <main>
    <h1>Зарегистрированные узлы</h1>
    <table id="nodes">
      <thead>
        <tr>
          <th>ID</th>
          <th>Хост</th>
          <th>Пользователь</th>
          <th>IP</th>
          <th>Ядро</th>
          <th>Последний контакт</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script>
    fetch('/api/statistics').then(r => r.json()).then(rows => {
      const tb = document.querySelector('#nodes tbody');
      rows.forEach(n => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${n.id}</td>
          <td>${n.hostname || '—'}</td>
          <td>${n.user}</td>
          <td>${n.local_ip}</td>
          <td>${n.kernel || '—'}</td>
          <td>${n.last_seen || '—'}</td>
          <td><a class="btn" href="/computers/${n.id}">Открыть</a></td>`;
        tb.appendChild(tr);
      });
    });
  </script>
</body>
</html>
