<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Регистрация — лаборатория</title>
  <link rel="stylesheet" href="/css/log.css" />
</head>
<body>
  <div class="container">
    <form id="regForm" class="form">
      <h2>Регистрация оператора</h2>
      <label for="username">Логин</label>
      <input id="username" type="text" required />
      <label for="password">Пароль</label>
      <input id="password" type="password" required />
      <button type="submit">Создать</button>
      <p class="switch"><a href="/login">Вход</a></p>
      <p id="msg" class="error" style="display:none;"></p>
    </form>
  </div>
  <script>
    document.getElementById('regForm').onsubmit = e => {
      e.preventDefault();
      fetch('/api/register', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      }).then(r => r.json()).then(d => {
        document.getElementById('msg').textContent = d.message || d.error;
        document.getElementById('msg').style.display = 'block';
        if (d.message) setTimeout(() => location.href='/login', 600);
      });
    };
  </script>
</body>
</html>
